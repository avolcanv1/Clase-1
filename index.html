<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Guion · Módulo 1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,wght@0,300;0,400;0,600;1,300&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #e8d5a3;
    --accent2: #a3c4e8;
    --green: #7ec88a;
    --red: #e87a7a;
    --muted: #555;
    --text: #e0e0e0;
    --text2: #888;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR ── */
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
    gap: 8px;
  }

  #slide-counter {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  #progress-bar {
    flex: 1;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  #section-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── MAIN CONTENT ── */
  #content-area {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .slide-view {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: 20px 16px 100px;
    opacity: 0;
    transform: translateX(30px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    -webkit-overflow-scrolling: touch;
  }
  .slide-view.active {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }
  .slide-view.exit-left {
    opacity: 0;
    transform: translateX(-30px);
    pointer-events: none;
  }

  /* ── SLIDE COMPONENTS ── */
  .slide-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text2);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: 4px;
    margin-bottom: 14px;
    letter-spacing: 0.04em;
  }
  .slide-tag::before {
    content: '▸';
    color: var(--accent);
    font-size: 8px;
  }

  .slide-title {
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 600;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 18px;
    letter-spacing: -0.02em;
  }

  .block-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  p.body-text {
    font-size: 15px;
    line-height: 1.65;
    color: var(--text);
    margin-bottom: 12px;
    font-weight: 300;
  }

  p.body-text strong {
    color: #fff;
    font-weight: 600;
  }

  .say-this {
    background: var(--surface);
    border-left: 2px solid var(--accent);
    padding: 12px 14px;
    border-radius: 0 6px 6px 0;
    margin-bottom: 14px;
    font-size: 14px;
    line-height: 1.6;
    color: #ccc;
    font-style: italic;
  }

  .pregunta {
    background: #0d1f12;
    border: 1px solid #2d5a35;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 14px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .pregunta-icon {
    font-size: 16px;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .pregunta p {
    font-size: 14px;
    line-height: 1.55;
    color: var(--green);
    font-weight: 400;
  }

  .tip {
    background: #120d1f;
    border: 1px solid #3d2d5a;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 14px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .tip-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
  .tip p { font-size: 13px; line-height: 1.55; color: #b8a3e8; }

  .warning {
    background: #1f0d0d;
    border: 1px solid #5a2d2d;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .warning p { font-size: 13px; color: var(--red); font-weight: 500; }

  .duration {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 20px;
    letter-spacing: 0.03em;
  }

  hr.divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }

  .numbered-list {
    list-style: none;
    margin-bottom: 14px;
  }
  .numbered-list li {
    display: flex;
    gap: 10px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .numbered-list li:last-child { border-bottom: none; }
  .numbered-list li .num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    flex-shrink: 0;
    margin-top: 2px;
    min-width: 20px;
  }

  .time-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .time-block .tb-label { font-size: 13px; color: var(--text); margin-bottom: 4px; }
  .time-block .tb-time { font-family: var(--mono); font-size: 11px; color: var(--accent2); }

  /* ── BOTTOM NAV ── */
  #bottom-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
    gap: 12px;
  }

  .nav-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    -webkit-appearance: none;
  }
  .nav-btn:active { background: var(--surface2); transform: scale(0.97); }
  .nav-btn:disabled { opacity: 0.3; pointer-events: none; }

  #btn-next {
    background: var(--accent);
    color: #0a0a0a;
    border-color: var(--accent);
    font-weight: 500;
    flex: 1;
  }
  #btn-next:active { background: #d4bc8a; }

  #btn-prev { width: 50px; text-align: center; padding: 10px; }

  /* ── MENU OVERLAY ── */
  #menu-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  #menu-overlay.open { display: flex; flex-direction: column; }

  #menu-inner {
    background: var(--surface);
    margin: auto 16px 0;
    border-radius: 16px 16px 0 0;
    padding: 20px 0 calc(20px + env(safe-area-inset-bottom));
    max-height: 75dvh;
    overflow-y: auto;
  }

  #menu-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text2);
    text-transform: uppercase;
    padding: 0 20px 14px;
    border-bottom: 1px solid var(--border);
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item:active { background: var(--surface2); }
  .menu-item.current { background: #1a1810; }

  .menu-num {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text2);
    width: 28px;
    flex-shrink: 0;
  }
  .menu-item.current .menu-num { color: var(--accent); }

  .menu-section-name {
    font-size: 13px;
    color: var(--text);
    line-height: 1.3;
    flex: 1;
  }
  .menu-item.current .menu-section-name { color: #fff; font-weight: 600; }

  .menu-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    opacity: 0;
  }
  .menu-item.current .menu-dot { opacity: 1; }

  #menu-close-area {
    flex: 1;
    cursor: pointer;
  }

  /* ── SECTION DIVIDER SLIDES ── */
  .section-hero {
    text-align: center;
    padding: 30px 0;
  }
  .section-hero .section-number {
    font-family: var(--mono);
    font-size: 60px;
    color: var(--surface2);
    line-height: 1;
    margin-bottom: 8px;
    font-weight: 300;
  }
  .section-hero .section-big-title {
    font-size: 28px;
    font-weight: 600;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .section-hero .section-period {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.1em;
  }

  /* scrollbar */
  .slide-view::-webkit-scrollbar { width: 3px; }
  .slide-view::-webkit-scrollbar-track { background: transparent; }
  .slide-view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <span id="slide-counter">1 / 52</span>
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <span id="section-label">Intro</span>
</div>

<!-- CONTENT -->
<div id="content-area" id="slides-container"></div>

<!-- BOTTOM NAV -->
<div id="bottom-nav">
  <button class="nav-btn" id="btn-prev">←</button>
  <button class="nav-btn" id="btn-menu" onclick="openMenu()">☰ Índice</button>
  <button class="nav-btn" id="btn-next">Siguiente →</button>
</div>

<!-- MENU -->
<div id="menu-overlay" onclick="handleMenuClick(event)">
  <div id="menu-close-area"></div>
  <div id="menu-inner">
    <div id="menu-title">Índice de secciones</div>
    <div id="menu-list"></div>
  </div>
</div>

<script>
const slides = [
  // ─── BLOQUE 1: INTRODUCCIÓN ───
  {
    section: "Introducción",
    tag: "Slide 1 — Portada",
    title: "Bienvenida",
    content: `
      <p class="body-text">Dejar que la slide respire. No decir nada de inmediato. Que el grupo se acomode.</p>
      <p class="body-text">Presentarse brevemente: nombre, trayectoria en pocas líneas, qué tipo de trabajo hacen hoy. <strong>Máx 2 minutos.</strong></p>
      <div class="say-this">"Hoy arrancamos el primer módulo del diplomado. Esta sesión es la más conceptual de todas — no vamos a abrir Illustrator hoy. Pero lo que vemos aquí es la base de todo lo que viene."</div>
      <div class="tip"><span class="tip-icon">💡</span><p>Si el grupo no se conoce, ronda rápida: nombre + qué hacen + por qué están aquí. Máx 30 seg por persona.</p></div>
    `
  },
  {
    section: "Introducción",
    tag: "Slide 2 — Introducción",
    title: "Dinámica de la sesión",
    content: `
      <div class="say-this">"Antes de arrancar con contenido, quiero que sepan cómo vamos a trabajar en este módulo."</div>
      <p class="body-text">Explicar: teoría + imágenes + preguntas al grupo. Habrá pausas. El ejercicio final integra todo lo que vemos hoy.</p>
    `
  },
  {
    section: "Introducción",
    tag: "Slide 3 — Objetivo",
    title: "Objetivo de la sesión",
    content: `
      <p class="body-text">Leer el objetivo en voz alta — literalmente leerlo.</p>
      <div class="say-this">"Los estudiantes aprenderán los fundamentos del diseño gráfico que les permitirán construir composiciones visuales coherentes y funcionales para diversos medios."</div>
      <div class="say-this">"Lo que significa esto en la práctica: al terminar este módulo van a poder mirar cualquier pieza gráfica y entender por qué funciona — o por qué no."</div>
      <div class="tip"><span class="tip-icon">💡</span><p>No explicar más el objetivo. La pregunta de la siguiente slide lo ancla mejor que cualquier explicación.</p></div>
    `
  },
  {
    section: "Introducción",
    tag: "Slides 4–6 — Contenidos",
    title: "Mapa del módulo",
    content: `
      <p class="body-text">Leer los cinco bloques: Historia, Principios, Tipografía, Color, Retícula.</p>
      <div class="say-this">"Hoy vemos el 1.1 — Historia. Puede parecer el bloque más teórico y el menos útil, pero es exactamente al revés. Vamos a ver por qué."</div>
      <p class="body-text">Al llegar a <strong>1.5 Composición con retícula</strong>:</p>
      <div class="say-this">"Este último bloque es el que más les va a cambiar cómo ven el diseño. Pero para llegar ahí necesitamos entender de dónde viene todo esto."</div>
    `
  },

  // ─── DEFINICIÓN ───
  {
    section: "Definición",
    tag: "Slide 7 — Definición",
    title: "¿Qué es el diseño gráfico?",
    content: `
      <p class="body-text">Mostrar la slide sin decir nada. Esperar 3–4 segundos.</p>
      <div class="pregunta"><span class="pregunta-icon">❓</span><p>¿Qué es para ustedes el diseño gráfico? Díganme lo primero que se les venga a la mente.</p></div>
      <p class="body-text">Recoger 3–4 respuestas. <strong>No corregirlas todavía.</strong> Solo escuchar.</p>
      <p class="body-text">Las respuestas van a variar mucho — algunos dirán "hacer logos", otros "usar Photoshop". Eso está perfecto.</p>
    `
  },
  {
    section: "Definición",
    tag: "Slide 8 — DG ≠ Illustrator",
    title: "Diseño ≠ Software",
    content: `
      <div class="say-this">"Empecemos por lo que el diseño gráfico NO es."</div>
      <div class="say-this">"El diseño gráfico no es el software. Illustrator es una herramienta — como un lápiz. Un carpintero no es su martillo."</div>
      <div class="say-this">"Esta distinción es importante porque muchos de ustedes vienen aquí exactamente a aprender las herramientas. Y las vamos a ver. Pero el pensamiento detrás es lo que hace que las herramientas sirvan de algo."</div>
      <div class="tip"><span class="tip-icon">💡</span><p>Si hay diseñadores de carrera en el grupo, apoyarse: "¿Tú qué dirías que es el diseño gráfico?"</p></div>
    `
  },
  {
    section: "Definición",
    tag: "Slides 9–10 — Definiciones",
    title: "ICOGRADA + AIGA",
    content: `
      <p class="body-text">Leer la definición ICOGRADA — o pedirle a alguien del grupo que la lea en voz alta.</p>
      <div class="say-this">"El diseño gráfico es una actividad <strong>intelectual, técnica y creativa</strong>..."</div>
      <p class="body-text">Subrayar tres palabras: <strong>intelectual, técnica, creativa</strong>.</p>
      <div class="say-this">"No es solo una de las tres. Es las tres juntas. Eso es lo que lo hace interesante — y lo que lo hace difícil."</div>
      <hr class="divider">
      <p class="body-text">Slide 10 — AIGA. Destacar:</p>
      <div class="say-this">"El diseño puede ocurrir a cualquier escala. Desde un sello postal hasta la señalización de todo un sistema de metro. Eso es lo que van a ver hoy."</div>
    `
  },
  {
    section: "Definición",
    tag: "Slides 11–13 — @rotulos.chidos",
    title: "Diseño en la calle",
    content: `
      <div class="say-this">"Antes de irnos al pasado, quiero mostrarles algo que todos conocen."</div>
      <div class="say-this">"Esto es diseño gráfico. Está en la calle, en el puesto de la esquina. Alguien tuvo que decidir qué fuente usar, qué colores, cómo disponer el texto."</div>
      <div class="say-this">"¿Funciona? Sí. ¿Es bello según los cánones académicos? Quizás no. Pero comunica. Y eso es diseño."</div>
      <p class="body-text">Slide 12: mismo lugar de día. Pasar rápido — la pausa larga va en Lance Wyman.</p>
    `
  },
  {
    section: "Definición",
    tag: "Slides 14–20 — Lance Wyman",
    title: "México 68 — Lance Wyman",
    content: `
      <div class="say-this">"Y ya que estamos en México, quiero mostrarles uno de los proyectos de diseño más importantes que se han hecho en este país."</div>
      <div class="say-this">"1968. México es sede de los Juegos Olímpicos. Le encargan el diseño a Lance Wyman — que estudió el arte prehispánico, la tradición huichol, y de ahí sacó este sistema."</div>
      <div class="pregunta"><span class="pregunta-icon">❓</span><p>¿Alguien conocía esto? ¿Han visto este logo antes?</p></div>
      <hr class="divider">
      <p class="body-text"><strong>Slides 15–16</strong>: sellos postales → material expositivo.</p>
      <div class="say-this">"Lo mismo que vieron en el logo se aplica a los sellos. El sistema es consistente — el mismo lenguaje visual funciona en cualquier formato."</div>
      <div class="say-this">"Y no solo en papel. Mamparas gigantes, pictogramas deportivos, todo dentro del mismo sistema."</div>
      <hr class="divider">
      <p class="body-text"><strong>Slide 17</strong>: Atlantes de Tula.</p>
      <div class="say-this">"Antes del término 'diseño gráfico' ya había comunicación visual. El diseño prehispánico tiene principios de composición tan rigurosos como cualquier escuela occidental."</div>
      <hr class="divider">
      <p class="body-text"><strong>Slides 18–20</strong>: estadio, piso aéreo.</p>
      <div class="say-this">"Diseño que funciona desde el sello de 2 cm hasta la fachada de un estadio. Eso es consistencia de sistema."</div>
      <div class="tip"><span class="tip-icon">💡</span><p>El piso del estadio solo cobra sentido desde arriba. Un buen diseño a veces tiene capas que no todos ven al mismo tiempo.</p></div>
    `
  },
  {
    section: "Definición",
    tag: "Slide 21 — Pregunta",
    title: "¿Tantas posibilidades?",
    content: `
      <p class="body-text">Leer la pregunta en pantalla:</p>
      <div class="say-this">"¿Se habían imaginado que el diseño gráfico tiene tantas posibilidades?"</div>
      <p class="body-text">Dejar que responda el grupo. 2–3 minutos de conversación libre.</p>
      <div class="warning"><p>⚡ PAUSA natural. Si llevan más de 45 min, descansar 5 minutos aquí.</p></div>
    `
  },

  // ─── PREHISTORIA ───
  {
    section: "Prehistoria",
    isSection: true,
    sectionNum: "02",
    sectionTitle: "La prehistoria del diseño",
    sectionPeriod: "Slides 22–30 · ~25 min",
  },
  {
    section: "Prehistoria",
    tag: "Slide 22 — Portada",
    title: "La prehistoria del DG",
    content: `
      <div class="say-this">"Acabamos de ver un ejemplo contemporáneo. Ahora vamos al origen. ¿Desde cuándo existe la comunicación visual?"</div>
    `
  },
  {
    section: "Prehistoria",
    tag: "Slide 23 — Pregunta",
    title: "¿Por qué estudiar historia?",
    content: `
      <div class="pregunta"><span class="pregunta-icon">❓</span><p>¿Para qué creen que sirve conocer la historia del diseño? ¿Qué les puede dar que no tienen ya?</p></div>
      <p class="body-text">Recoger respuestas. Posibles: inspiración, evitar reinventar la rueda, entender por qué las cosas se ven como se ven.</p>
      <div class="say-this">"Exactamente. Y hay algo más: cuando conoces la historia, puedes <strong>citar conscientemente</strong> en lugar de copiar inconscientemente."</div>
    `
  },
  {
    section: "Prehistoria",
    tag: "Slide 24 — Argelia",
    title: "Pinturas rupestres · 10,000 a.C.",
    content: `
      <div class="say-this">"Lo más antiguo que vamos a ver hoy. Pinturas rupestres en Argelia. 10,000 a.C."</div>
      <div class="say-this">"Alguien tomó pigmento mineral y lo aplicó en piedra para representar animales, movimiento, cacería. ¿Por qué? Para comunicar."</div>
      <div class="say-this">"La intención no es diferente a la de un infographic de hoy: mostrar algo complejo de manera visual."</div>
    `
  },
  {
    section: "Prehistoria",
    tag: "Slide 25 — Mesopotamia",
    title: "Cuneiforme · 3,500 a.C.",
    content: `
      <div class="say-this">"Cuneiforme, la escritura más antigua conocida. Mesopotamia, hoy Irak."</div>
      <div class="say-this">"Alguien diseñó un sistema de signos, y alguien imprimió esos signos en un soporte. Si lo piensan, eso es básicamente lo que hace un tipógrafo hoy."</div>
    `
  },
  {
    section: "Prehistoria",
    tag: "Slide 26 — Egipto",
    title: "Libro de los Muertos · 1,540 a.C.",
    content: `

        <li><span class="num">1.</span>Crear cuenta en Figma si no la tienen.</li>
        <li><span class="num">2.</span>Elegir el tema para el ejercicio final.</li>
        <li><span class="num">3.</span>Recolectar 10 referencias visuales que los inspiren.</li>
      </ul>
      <hr class="divider">
      <p class="block-label">Tiempos totales</p>
      <div class="time-block"><div class="tb-label">Introducción + Definición</div><div class="tb-time">~40 min</div></div>
      <div class="time-block"><div class="tb-label">Prehistoria</div><div class="tb-time">~25 min</div></div>
      <div class="time-block"><div class="tb-label">Art Nouveau</div><div class="tb-time">~20 min</div></div>
      <div class="time-block"><div class="tb-label">[ Pausa ]</div><div class="tb-time">10 min</div></div>
      <div class="time-block"><div class="tb-label">Bauhaus</div><div class="tb-time">~25 min</div></div>
      <div class="time-block"><div class="tb-label">Estilo Internacional</div><div class="tb-time">~25 min</div></div>
      <div class="time-block"><div class="tb-label">[ Pausa ]</div><div class="tb-time">10 min</div></div>
      <div class="time-block"><div class="tb-label">Postmodernismo + Actividad</div><div class="tb-time">~45 min</div></div>
      <div class="time-block"><div class="tb-label">Referencias + Ejercicio + Cierre</div><div class="tb-time">~25 min</div></div>
      <div class="time-block" style="border-color: var(--accent); background: #1a1810;">
        <div class="tb-label" style="color: #fff; font-weight: 600;">TOTAL</div>
        <div class="tb-time" style="color: var(--accent); font-size: 14px;">~3:30 – 4:00 horas</div>
      </div>

  },
];

// ── RENDER ──
let current = 0;
const container = document.getElementById('content-area');
const progressFill = document.getElementById('progress-fill');
const slideCounter = document.getElementById('slide-counter');
const sectionLabel = document.getElementById('section-label');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const total = slides.length;

function buildSlide(slide, index) {
  const div = document.createElement('div');
  div.className = 'slide-view';
  div.dataset.index = index;

  if (slide.isSection) {
    div.innerHTML = `
      <div class="section-hero">
        <div class="section-number">${slide.sectionNum}</div>
        <div class="section-big-title">${slide.sectionTitle.replace('\n','<br>')}</div>
        <div class="section-period">${slide.sectionPeriod}</div>
      </div>
    `;
  } else {
    div.innerHTML = `
      <div class="slide-tag">${slide.tag}</div>
      <div class="slide-title">${slide.title}</div>
      ${slide.content}
    `;
  }
  return div;
}

// Build all slides
const slideEls = slides.map((s, i) => {
  const el = buildSlide(s, i);
  container.appendChild(el);
  return el;
});

function updateUI() {
  const slide = slides[current];
  progressFill.style.width = `${((current + 1) / total) * 100}%`;
  slideCounter.textContent = `${current + 1} / ${total}`;
  sectionLabel.textContent = slide.section;
  btnPrev.disabled = current === 0;
  btnNext.textContent = current === total - 1 ? '✓ Fin' : 'Siguiente →';
}

function goTo(index, direction = 1) {
  if (index < 0 || index >= total) return;

  const oldEl = slideEls[current];
  const newEl = slideEls[index];

  oldEl.classList.remove('active');
  oldEl.classList.add(direction > 0 ? 'exit-left' : 'exit-right');

  newEl.style.transform = `translateX(${direction > 0 ? '30px' : '-30px'})`;
  newEl.style.opacity = '0';
  newEl.classList.add('active');

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      newEl.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
      newEl.style.transform = 'translateX(0)';
      newEl.style.opacity = '1';
      newEl.scrollTop = 0;
    });
  });

  setTimeout(() => {
    oldEl.classList.remove('exit-left', 'exit-right');
    oldEl.style.transform = '';
    oldEl.style.opacity = '';
  }, 300);

  current = index;
  updateUI();
}

// Init
slideEls[0].classList.add('active');
updateUI();

btnNext.addEventListener('click', () => {
  if (current < total - 1) goTo(current + 1, 1);
});
btnPrev.addEventListener('click', () => {
  if (current > 0) goTo(current - 1, -1);
});

// Swipe support
let touchStartX = 0;
let touchStartY = 0;
container.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
container.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) > 50) {
    if (dx < 0 && current < total - 1) goTo(current + 1, 1);
    if (dx > 0 && current > 0) goTo(current - 1, -1);
  }
}, { passive: true });

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1, 1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(current - 1, -1);
});

// Menu
function openMenu() {
  const overlay = document.getElementById('menu-overlay');
  const list = document.getElementById('menu-list');
  list.innerHTML = '';

  // Group by section
  const seen = new Set();
  slides.forEach((slide, i) => {
    const key = slide.section;
    if (!seen.has(key)) {
      seen.add(key);
      const first = slides.findIndex(s => s.section === key);
      const item = document.createElement('div');
      item.className = 'menu-item' + (slide.section === slides[current].section ? ' current' : '');
      item.innerHTML = `
        <span class="menu-num">${String(first + 1).padStart(2, '0')}</span>
        <span class="menu-section-name">${key}</span>
        <span class="menu-dot"></span>
      `;
      item.addEventListener('click', () => {
        goTo(first, first > current ? 1 : -1);
        closeMenu();
      });
      list.appendChild(item);
    }
  });

  overlay.classList.add('open');
}

function closeMenu() {
  document.getElementById('menu-overlay').classList.remove('open');
}

function handleMenuClick(e) {
  if (e.target === document.getElementById('menu-overlay') || e.target === document.getElementById('menu-close-area')) {
    closeMenu();
  }
}
</script>
